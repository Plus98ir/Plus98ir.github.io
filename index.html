<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروژه‌های من | Plus98ir</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border: #30363d;
            --accent-blue: #2196f3;
            --accent-green: #00e676;
            --white: #ffffff;
            --glow-blue: rgba(33, 150, 243, 0.2);
            --glow-green: rgba(0, 230, 118, 0.2);
        }
        body {
            font-family: Tahoma, 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 50px 20px;
            direction: ltr;
        }
        .container { 
            max-width: 1200px; /* عرض کل صفحه رو بیشتر کردم */
            margin: 0 auto; 
        }
        h1 {
            text-align: center;
            /* ترکیب رنگ سفید با سایه‌های آبی و سبز برای تیتر */
            color: var(--white);
            text-shadow: 0 0 10px var(--accent-blue), 0 0 20px var(--accent-green);
            margin-bottom: 60px;
            font-size: 2.8rem;
            letter-spacing: 2px;
        }
        .repo-grid {
            display: grid;
            /* عرض کادرها از 320 به 450 پیکسل افزایش پیدا کرد تا بزرگ‌تر بشن */
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 30px;
        }
        .repo-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 35px; /* پدینگ بیشتر برای بزرگ‌تر شدن کارت‌ها */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .repo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            /* گرادیانت جذاب آبی به سبز برای نوار کنار کادرها */
            background: linear-gradient(to bottom, var(--accent-blue), var(--accent-green));
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .repo-card:hover {
            transform: translateY(-8px);
            /* سایه ترکیبی سفید و آبی هنگام رفتن موس روی کارت */
            box-shadow: 0 12px 25px var(--glow-blue), 0 5px 15px rgba(255, 255, 255, 0.05);
            border-color: var(--accent-blue);
        }
        .repo-card:hover::before {
            opacity: 1;
        }
        .repo-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--white); /* رنگ عنوان‌ها سفید شد */
            text-decoration: none;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: color 0.3s ease;
        }
        .repo-card:hover .repo-title {
            color: var(--accent-blue); /* هنگام هاور رنگ عنوان آبی میشه */
        }
        .repo-desc {
            color: var(--text-muted);
            font-size: 1.05rem;
            flex-grow: 1;
            margin-bottom: 25px;
            line-height: 1.7;
        }
        .repo-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-main);
            border-top: 1px solid var(--border);
            padding-top: 18px;
        }
        .repo-meta span { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .loader { 
            text-align: center; 
            color: var(--white); 
            font-size: 1.3rem;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; text-shadow: 0 0 5px var(--accent-blue); }
            50% { opacity: 1; text-shadow: 0 0 15px var(--accent-green); }
            100% { opacity: 0.6; text-shadow: 0 0 5px var(--accent-blue); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Plus98ir Projects</h1>
        <div id="loading" class="loader">Loading repositories from GitHub...</div>
        <div id="repo-grid" class="repo-grid"></div>
    </div>

    <script>
        async function fetchRepos() {
            try {
                const response = await fetch('https://api.github.com/users/Plus98ir/repos?sort=updated');
                const repos = await response.json();
                
                const grid = document.getElementById('repo-grid');
                document.getElementById('loading').style.display = 'none';

                repos.forEach(repo => {
                    if (repo.name.toLowerCase() === 'plus98ir.github.io') return;

                    const card = document.createElement('div');
                    card.className = 'repo-card';
                    
                    const langColor = repo.language === 'Python' ? '#3572A5' : 
                                      repo.language === 'Shell' ? '#89e051' : 
                                      repo.language === 'HTML' ? '#e34c26' : '#f1e05a';
                                      
                    const langDot = repo.language ? `<span style="color:${langColor}; font-size: 1.3rem;">●</span> ${repo.language}` : '';
                    
                    const stars = repo.stargazers_count > 0 ? `<span style="color: #ffd700;">⭐ ${repo.stargazers_count}</span>` : '';

                    card.innerHTML = `
                        <a href="${repo.html_url}" target="_blank" class="repo-title">
                            <span style="color: var(--accent-green);">📁</span> ${repo.name}
                        </a>
                        <div class="repo-desc">${repo.description || 'No description available for this project.'}</div>
                        <div class="repo-meta">
                            <span>${langDot}</span>
                            ${stars}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                document.getElementById('loading').innerText = 'Failed to load projects. Please try again later.';
            }
        }
        fetchRepos();
    </script>
</body>
</html>
