<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروژه‌های من | Plus98ir</title>
    <style>
        /* حالت پیش‌فرض (روشن) */
        :root {
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --text-main: #24292f;
            --text-muted: #57606a;
            --border: #d0d7de;
            --accent-blue: #0969da;
            --accent-green: #1a7f37;
            --heading-color: #24292f;
            --glow-blue: rgba(9, 105, 218, 0.2);
            --glow-green: rgba(26, 127, 55, 0.2);
            --title-shadow: 0 0 10px rgba(9, 105, 218, 0.2);
            --card-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            --card-hover-shadow: 0 12px 25px var(--glow-blue), 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* تغییر خودکار به حالت تاریک بر اساس سیستم کاربر */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0d1117;
                --card-bg: #161b22;
                --text-main: #c9d1d9;
                --text-muted: #8b949e;
                --border: #30363d;
                --accent-blue: #2f81f7;
                --accent-green: #2ea043;
                --heading-color: #ffffff;
                --glow-blue: rgba(47, 129, 247, 0.2);
                --glow-green: rgba(46, 160, 67, 0.2);
                --title-shadow: 0 0 10px var(--accent-blue), 0 0 20px var(--accent-green);
                --card-shadow: none;
                --card-hover-shadow: 0 12px 25px var(--glow-blue), 0 5px 15px rgba(255, 255, 255, 0.05);
            }
        }

        body {
            font-family: Tahoma, 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 50px 20px;
            direction: ltr;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .container { 
            max-width: 1200px;
            margin: 0 auto; 
        }
        h1 {
            text-align: center;
            color: var(--heading-color);
            text-shadow: var(--title-shadow);
            margin-bottom: 60px;
            font-size: 2.8rem;
            letter-spacing: 2px;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 30px;
        }
        .repo-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 35px;
            box-shadow: var(--card-shadow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .repo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(to bottom, var(--accent-blue), var(--accent-green));
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .repo-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--card-hover-shadow);
            border-color: var(--accent-blue);
        }
        .repo-card:hover::before {
            opacity: 1;
        }
        .repo-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--heading-color);
            text-decoration: none;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: color 0.3s ease;
        }
        .repo-card:hover .repo-title {
            color: var(--accent-blue);
        }
        .repo-desc {
            color: var(--text-muted);
            font-size: 1.05rem;
            flex-grow: 1;
            margin-bottom: 25px;
            line-height: 1.7;
        }
        .repo-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-main);
            border-top: 1px solid var(--border);
            padding-top: 18px;
        }
        .repo-meta span { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .loader { 
            text-align: center; 
            color: var(--heading-color); 
            font-size: 1.3rem;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; text-shadow: 0 0 10px var(--accent-blue); }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Plus98ir Projects</h1>
        <div id="loading" class="loader">Loading repositories from GitHub...</div>
        <div id="repo-grid" class="repo-grid"></div>
    </div>

    <script>
        async function fetchRepos() {
            try {
                const response = await fetch('https://api.github.com/users/Plus98ir/repos?sort=updated');
                const repos = await response.json();
                
                const grid = document.getElementById('repo-grid');
                document.getElementById('loading').style.display = 'none';

                repos.forEach(repo => {
                    if (repo.name.toLowerCase() === 'plus98ir.github.io') return;

                    const card = document.createElement('div');
                    card.className = 'repo-card';
                    
                    const langColor = repo.language === 'Python' ? '#3572A5' : 
                                      repo.language === 'Shell' ? '#89e051' : 
                                      repo.language === 'HTML' ? '#e34c26' : '#f1e05a';
                                      
                    const langDot = repo.language ? `<span style="color:${langColor}; font-size: 1.3rem;">●</span> ${repo.language}` : '';
                    
                    const stars = repo.stargazers_count > 0 ? `<span style="color: #ffd700;">⭐ ${repo.stargazers_count}</span>` : '';

                    // سیستم هوشمند تشخیص آدرس
                    let projectUrl = repo.html_url; 
                    if (repo.homepage && repo.homepage !== "") {
                        projectUrl = repo.homepage;
                    } else if (repo.has_pages) {
                        // ارجاع مستقیم به index-en.html اعمال شد
                        projectUrl = `https://plus98ir.dpdns.org/${repo.name}/index-en.html`;
                    }

                    card.innerHTML = `
                        <a href="${projectUrl}" class="repo-title">
                            <span style="color: var(--accent-green);">📁</span> ${repo.name}
                        </a>
                        <div class="repo-desc">${repo.description || 'No description available for this project.'}</div>
                        <div class="repo-meta">
                            <span>${langDot}</span>
                            ${stars}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                document.getElementById('loading').innerText = 'Failed to load projects. Please try again later.';
            }
        }
        fetchRepos();
    </script>
</body>
</html>
