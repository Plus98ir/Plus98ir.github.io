<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروژه‌های من | Plus98ir</title>
    <style>
        /* === متغیرهای رنگی === */
        :root {
            --bg-base: #f0f2f5;
            --bg-card: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --border-color: rgba(0, 0, 0, 0.08);
            --accent-primary: #06c;
            --accent-secondary: #00d26a;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --hover-shadow: 0 20px 40px rgba(0, 102, 204, 0.15);
            --badge-bg: rgba(0, 0, 0, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-base: #0a0b10;
                --bg-card: #14151a;
                --text-main: #f5f5f7;
                --text-muted: #a1a1a6;
                --border-color: rgba(255, 255, 255, 0.08);
                --accent-primary: #2997ff;
                --accent-secondary: #30d158;
                --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                --hover-shadow: 0 20px 50px rgba(41, 151, 255, 0.2);
                --badge-bg: rgba(255, 255, 255, 0.08);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            padding: 60px 20px;
            direction: ltr;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .container { 
            max-width: 1300px;
            margin: 0 auto; 
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 60px;
            letter-spacing: -1px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 40px;
        }

        /* === استایل کارت‌ها === */
        .repo-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            text-decoration: none;
            cursor: pointer;
            overflow: hidden;
            padding: 0; /* حذف پدینگ برای چسبیدن عکس */
        }

        .repo-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: var(--hover-shadow);
            border-color: var(--accent-primary);
        }

        /* بخش عکس بالای کارت */
        .card-image {
            width: 100%;
            height: 180px;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
            background-color: #1a1b22;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .repo-card:hover .card-image img {
            transform: scale(1.08); /* افکت زوم روی عکس */
        }

        /* بخش متون کارت */
        .card-content {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .repo-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .repo-desc {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            flex-grow: 1;
            margin-bottom: 25px;
        }

        /* === آمار و کلیک === */
        .repo-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .badge-group {
            display: flex;
            gap: 10px;
        }

        .badge {
            background-color: var(--badge-bg);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
        }

        .click-counter {
            background-color: rgba(41, 151, 255, 0.1);
            color: var(--accent-primary);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            transition: all 0.3s ease;
        }

        .repo-card:hover .click-counter {
            background-color: var(--accent-primary);
            color: #fff;
        }

        .loader { 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 1.2rem;
            animation: pulse 2s infinite ease-in-out;
            margin-bottom: 30px;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Plus98ir Projects</h1>
        <div id="loading" class="loader">Loading your workspace...</div>
        <div id="repo-grid" class="repo-grid"></div>
    </div>

    <script>
        // 📌 اینجا می‌تونی آدرس عکس هر پروژه رو به دلخواه خودت تغییر بدی
        // فرمت: "اسم-دقیق-پروژه-در-گیت‌هاب": "آدرس-لینک-عکس"
        const repoImages = {
            "Fortnite_Missions": "fortnite_mission.png", // عکس فورتنایت
            "DNS-Server-Config": "https://github.com/Plus98ir/DNS-Server-Config/blob/main/dns_server.png?raw=true", // عکس سرور/دی‌ان‌اس
            "AdGuard_Rules": "https://github.com/Plus98ir/AdGuard_Rules/blob/main/adguard-cover.png?raw=true", // عکس ادگارد
            
            // عکسی که اگر برای پروژه‌ای آدرس نذاشتی، به صورت پیش‌فرض نشون داده می‌شه
            "default": "https://images.unsplash.com/photo-1618401471353-b98afee0b2eb?q=80&w=800&auto=format&fit=crop"
        };

        // تابع ثبت کلیک
        function trackClick(repoName, url) {
            let currentClicks = parseInt(localStorage.getItem('clicks_' + repoName)) || 0;
            currentClicks++;
            localStorage.setItem('clicks_' + repoName, currentClicks);
            document.getElementById('clicks-' + repoName).innerText = currentClicks;
            window.location.href = url;
        }

        async function fetchRepos() {
            try {
                const response = await fetch('https://api.github.com/users/Plus98ir/repos?sort=updated');
                const repos = await response.json();
                
                const grid = document.getElementById('repo-grid');
                document.getElementById('loading').style.display = 'none';

                repos.forEach(repo => {
                    if (repo.name.toLowerCase() === 'plus98ir.github.io') return;

                    // پیدا کردن آدرس پروژه
                    let projectUrl = repo.html_url; 
                    if (repo.homepage && repo.homepage !== "") {
                        projectUrl = repo.homepage;
                    } else if (repo.has_pages) {
                        projectUrl = `https://plus98ir.dpdns.org/${repo.name}/index-en.html`;
                    }

                    // پیدا کردن عکس مربوط به پروژه (یا استفاده از عکس پیش‌فرض)
                    let coverImage = repoImages[repo.name] || repoImages["default"];

                    let savedClicks = localStorage.getItem('clicks_' + repo.name) || 0;

                    const langColor = repo.language === 'Python' ? '#3572A5' : 
                                      repo.language === 'Shell' ? '#89e051' : 
                                      repo.language === 'HTML' ? '#e34c26' : '#f1e05a';
                                      
                    const langBadge = repo.language ? `<div class="badge"><span style="color:${langColor};">●</span> ${repo.language}</div>` : '';
                    const starBadge = repo.stargazers_count > 0 ? `<div class="badge">⭐ ${repo.stargazers_count}</div>` : '';

                    const card = document.createElement('a');
                    card.className = 'repo-card';
                    card.onclick = (e) => {
                        e.preventDefault(); 
                        trackClick(repo.name, projectUrl); 
                    };

                    card.innerHTML = `
                        <div class="card-image">
                            <img src="${coverImage}" alt="${repo.name} cover">
                        </div>
                        <div class="card-content">
                            <div class="repo-title">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                                ${repo.name}
                            </div>
                            <div class="repo-desc">${repo.description || 'No description available for this project.'}</div>
                            
                            <div class="repo-meta">
                                <div class="badge-group">
                                    ${langBadge}
                                    ${starBadge}
                                </div>
                                <div class="click-counter">
                                    <span id="clicks-${repo.name}">${savedClicks}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                document.getElementById('loading').innerText = 'Failed to load projects. Please try again later.';
            }
        }
        fetchRepos();
    </script>
</body>
</html>
