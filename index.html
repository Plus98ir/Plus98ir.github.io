<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروژه‌های من | Plus98ir</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border: #30363d;
            --neon-accent: #00ff88;
            --neon-glow: rgba(0, 255, 136, 0.2);
        }
        body {
            font-family: Tahoma, 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            direction: ltr;
        }
        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
        }
        h1 {
            text-align: center;
            color: white;
            text-shadow: 0 0 15px var(--neon-accent);
            margin-bottom: 50px;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }
        .repo-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .repo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--neon-accent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .repo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px var(--neon-glow);
            border-color: var(--neon-accent);
        }
        .repo-card:hover::before {
            opacity: 1;
        }
        .repo-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--neon-accent);
            text-decoration: none;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .repo-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            flex-grow: 1;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .repo-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }
        .repo-meta span { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        .loader { 
            text-align: center; 
            color: var(--neon-accent); 
            font-size: 1.2rem;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Plus98ir Projects</h1>
        <div id="loading" class="loader">Loading repositories from GitHub...</div>
        <div id="repo-grid" class="repo-grid"></div>
    </div>

    <script>
        async function fetchRepos() {
            try {
                // اتصال به API گیت‌هاب و دریافت پروژه‌ها بر اساس تاریخ آپدیت
                const response = await fetch('https://api.github.com/users/Plus98ir/repos?sort=updated');
                const repos = await response.json();
                
                const grid = document.getElementById('repo-grid');
                document.getElementById('loading').style.display = 'none';

                repos.forEach(repo => {
                    // مخفی کردن ریپازیتوری خود سایت
                    if (repo.name.toLowerCase() === 'plus98ir.github.io') return;

                    const card = document.createElement('div');
                    card.className = 'repo-card';
                    
                    // تنظیم رنگ نقطه‌ها بر اساس زبان برنامه‌نویسی
                    const langColor = repo.language === 'Python' ? '#3572A5' : 
                                      repo.language === 'Shell' ? '#89e051' : 
                                      repo.language === 'HTML' ? '#e34c26' : '#f1e05a';
                                      
                    const langDot = repo.language ? `<span style="color:${langColor}; font-size: 1.2rem;">●</span> ${repo.language}` : '';
                    
                    const stars = repo.stargazers_count > 0 ? `<span>⭐ ${repo.stargazers_count}</span>` : '';

                    card.innerHTML = `
                        <a href="${repo.html_url}" target="_blank" class="repo-title">
                            📁 ${repo.name}
                        </a>
                        <div class="repo-desc">${repo.description || 'No description available for this project.'}</div>
                        <div class="repo-meta">
                            <span>${langDot}</span>
                            ${stars}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                document.getElementById('loading').innerText = 'Failed to load projects. Please try again later.';
            }
        }
        fetchRepos();
    </script>
</body>
</html>
