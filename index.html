<script>
fetch("https://api.github.com/users/Plus98ir/repos")
    .then(response => {
        if (!response.ok) {
            throw new Error("GitHub API Error");
        }
        return response.json();
    })
    .then(repos => {

        const list = document.getElementById("repos-list");
        list.innerHTML = "";

        repos
            .filter(repo => repo.name !== "Plus98ir.github.io")
            .sort((a, b) => a.name.localeCompare(b.name))
            .forEach(repo => {

                const li = document.createElement("li");

                li.innerHTML = `
                    <strong>${repo.name}</strong>
                    —
                    <a href="/${repo.name}">View Project</a>
                    <span style="color:#666;">
                        ${repo.description ?? "No description"}
                    </span>
                `;

                list.appendChild(li);

            });

    })
    .catch(error => {

        console.error(error);

        document.getElementById("repos-list").innerHTML =
            "<li>❌ Could not load repositories.</li>";

    });
</script>
